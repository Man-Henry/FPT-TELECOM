name: Lighthouse CI
on:
  pull_request:
    branches: [main]

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lighthouse Audit
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: https://fpttelecomvn.click/
          budgetPath: ./budget.json
          uploadArtifacts: true
