name: Tự động lấy tin tức FPT

on:
  schedule:
    # Chạy mỗi ngày lúc 00:00 (theo chuẩn UTC)
    - cron: '0 0 * * *'
  workflow_dispatch:
    # Cho phép bấm nút chạy thủ công trên giao diện GitHub

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Chạy script lấy tin tức
        run: python scripts/auto_news.py

      - name: Commit và Push nếu có sự thay đổi
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Auto-update: Lấy tin tức mới từ FPT.vn" || echo "Không có tin tức mới để cập nhật"
          git push
