  <script>
    const cwvData = { LCP: 0, CLS: 0, FCP: 0, INP: 0 };
    new PerformanceObserver(list => {
      const entries = list.getEntries();
      cwvData.LCP = entries[entries.length - 1].startTime;
    }).observe({ type: 'largest-contentful-paint', buffered: true });
    new PerformanceObserver(list => {
      for (const entry of list.getEntries()) {
        if (!entry.hadRecentInput) cwvData.CLS += entry.value;
      }
    }).observe({ type: 'layout-shift', buffered: true });
    new PerformanceObserver(list => {
      const fcp = list.getEntriesByName('first-contentful-paint')[0];
      if (fcp) cwvData.FCP = fcp.startTime;
    }).observe({ type: 'paint', buffered: true });
    new PerformanceObserver(list => {
      for (const entry of list.getEntries()) {
        if (entry.duration > cwvData.INP) cwvData.INP = entry.duration;
      }
    }).observe({ type: 'event', buffered: true, durationThreshold: 40 });
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden' && typeof gtag === 'function') {
        for (const [name, value] of Object.entries(cwvData)) {
          if (value > 0) {
            gtag('event', name, {
              value: Math.round(name === 'CLS' ? value * 1000 : value),
              event_category: 'Web Vitals',
              non_interaction: true
            });
          }
        }
      }
    });
  </script>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      // Intersection Observer for scroll animations
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('is-visible');
          }
        });
      }, { threshold: 0.1, rootMargin: "0px 0px -50px 0px" });

      document.querySelectorAll('.scroll-animate').forEach(el => {
        observer.observe(el);
      });
    });
  </script>
